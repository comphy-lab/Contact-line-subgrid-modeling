name: Deploy on Search Database Update

on:
  push:
    branches: [ main ]
    paths:
      - '.github/docs/assets/js/search_db.json'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment across Pages workflows; queue older runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-latest:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: check
        name: Check if latest commit
        run: |
          should_skip=false
          if latest_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"; then
            if [ -n "$latest_sha" ] && [ "$latest_sha" != "$GITHUB_SHA" ]; then
              should_skip=true
            fi
          fi

          echo "should_skip=$should_skip" >> "$GITHUB_OUTPUT"

  build:
    needs: check-latest
    if: ${{ needs.check-latest.outputs.should-skip == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Pandoc
        shell: bash
        env:
          PANDOC_VERSION: '2.19.2'
          PANDOC_DEB_SHA256: e5276b8ec6f2f25d85caa7f529a09117dcd346e04a8a5dcca755c58043b4a6f9
        run: |
          set -euo pipefail
          deb="${RUNNER_TEMP}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl --retry 3 --fail --location --silent --show-error \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            --output "${deb}"
          printf '%s  %s\n' "${PANDOC_DEB_SHA256}" "${deb}" | \
            sha256sum --check --strict -
          sudo dpkg --install "${deb}"
          test "$(pandoc --version | sed -n 1p)" = "pandoc ${PANDOC_VERSION}"

      - name: Build documentation site
        run: bash .github/scripts/build.sh --force-rebuild

      - name: Verify deployment entry point
        run: test -s .github/docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.github/docs'  # Deploy the pre-built docs directory

  # The deployment runs in its own job, after the upload has completed, so it
  # never asks for an artifact that is not yet listed.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # A re-run of this job reuses the artifact of its own commit. Deploy it
      # only while that commit is still the head of the branch, so a late
      # re-run cannot replace a newer deployment with older pages.
      - name: Check that this commit is still the latest
        id: fresh
        run: |
          set -euo pipefail
          refs="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}")"
          latest_sha="$(printf '%s\n' "$refs" | cut -f1)"
          if [ -z "$latest_sha" ]; then
            echo "::error::Could not read the head of ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${GITHUB_REF_NAME} has moved to ${latest_sha}; not deploying ${GITHUB_SHA}"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.fresh.outputs.current == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
